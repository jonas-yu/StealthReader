name: Build Windows EXE

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller==6.11.1"

      - name: Show build environment
        run: |
          python -c "import sys; print(sys.version)"
          pyinstaller --version

      - name: Build onefile EXE
        run: pyinstaller --clean --noconfirm --distpath dist StealthReader.spec

      - name: Build onedir fallback
        run: |
          $env:SR_MODE = "onedir"
          pyinstaller --noconfirm --distpath dist-onedir StealthReader.spec
          Compress-Archive -Path dist-onedir/StealthReader/* -DestinationPath dist-onedir/StealthReader-onedir.zip

      - name: Print SHA256
        run: |
          Get-FileHash dist/StealthReader.exe -Algorithm SHA256 | Format-List
          Get-Item dist/StealthReader.exe | Select-Object Name, Length

      - name: Upload onefile EXE
        uses: actions/upload-artifact@v4
        with:
          name: StealthReader-Windows
          path: dist/StealthReader.exe

      - name: Upload onedir fallback
        uses: actions/upload-artifact@v4
        with:
          name: StealthReader-Windows-onedir
          path: dist-onedir/StealthReader-onedir.zip
